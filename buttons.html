<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="document.getElementById('paragraph').innerHTML='these are your items: ' + cartQuantity;">show</button>
    <button onclick="cartQuantity++">add to cart</button>
    <button onclick="cartQuantity+=2">+2</button>
    <button onclick="cartQuantity+=3">+3</button>
    <button onclick="cartQuantity=0">clear cart</button>
    <p id="paragraph"></p>
    <script>
        let cartQuantity = 6;
    </script>
</body>
</html>
